<html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pranav | Contact</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="brand">
      <span class="logo">Pranav</span>
      <small class="muted">Aspiring JEE Student</small>
    </div>
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="skills.html">Skills</a>
      <a href="contact.html" class="cta">Contact</a>
    </nav>
  </header>

  <section id="contact">
    <h2>Contact Me</h2>
    <p class="muted">Feel free to reach out!</p>

    <div class="contact-grid reveal">
      <div class="contact-box">
        <div class="icon">📍</div>
        <p>Bengaluru, Karnataka, India</p>
      </div>
      <div class="contact-box">
        <div class="icon">📧</div>
        <p>pranav@example.com</p>
      </div>
      <div class="contact-box">
        <div class="icon">📞</div>
        <p>+91 1234567890</p>
      </div>
      <div class="contact-box">
        <div class="icon">🌐</div>
        <p>Social Media Links</p>
      </div>
    </div>

    <form class="message-form reveal">
      <input type="text" placeholder="Name" required>
      <input type="email" placeholder="Email" required>
      <textarea placeholder="Message" rows="5" required></textarea>
      <button type="button" id="sendMsg">Send Message</button>
      <p id="msgStatus"></p>
    </form>
  </section>

  <script src="js/script.js"></script>
</body>
</html>
